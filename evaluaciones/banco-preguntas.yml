    prompt: "Ejemplo no calificado: una aplicación recibe picos impredecibles y el consumidor puede procesar mensajes de forma asíncrona. ¿Qué patrón conviene evaluar primero?"
    select: 1
    options:
      A: "Acoplar productor y consumidor con llamadas síncronas directas."
      B: "Usar una cola para desacoplar productor y consumidor."
      C: "Aumentar manualmente la capacidad fija antes de cada pico."
      D: "Eliminar reintentos para evitar duplicados."
